<span class="card" (click)="selectCard()">
  <img [src]="product.imgUrl" width="100px" height="100px" object-fit="cover" />
  <div class="text d-flex align-items-start flex-column">
    <div class="title-div p-2">
      <h3>{{ product.title }}</h3>
    </div>
    <div class="description-div p-2">
      <p>Description</p>
    </div>
  </div>
</span>
